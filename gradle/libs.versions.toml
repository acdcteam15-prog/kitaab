# Every version here was checked against official release pages / GitHub releases (see SETUP.md).
# play-services-auth is deliberately kept at 21.5.1: 22.0.0 removes the Google Sign-In API this app uses.
# Kotlin (2.4.21) and KSP (2.3.13) are set in the root build.gradle.kts (buildscript classpath, see there).

[versions]
agp                  = "9.4.0"
googleServices       = "4.5.0"
firebaseBom          = "35.0.1"
coreKtx              = "1.19.1"
appcompat            = "1.8.0"
material             = "1.14.0"
constraintlayout     = "2.2.2"
activityKtx          = "1.13.0"
lifecycle            = "2.11.0"
coroutines           = "1.11.0"
playServicesAuth     = "21.5.1"
googleApiClient      = "2.9.2"
googleApiDrive       = "v3-rev20260720-2.0.0"
googleHttpClient     = "2.2.0"
googleOauthClient    = "1.39.0"
gson                 = "2.15.0"
pdfViewer            = "v3.2.0-beta06"
pdfbox               = "2.0.27.0"
room                 = "2.8.5"
glide                = "5.0.9"
recyclerview         = "1.4.0"
preference           = "1.2.1"
swiperefresh         = "1.2.0"
gridlayout           = "1.1.0"
work                 = "2.12.0"
profileinstaller     = "1.4.1"
junit                = "4.13.2"

[libraries]
firebase-bom                     = { group = "com.google.firebase",              name = "firebase-bom",                    version.ref = "firebaseBom" }
firebase-database                = { group = "com.google.firebase",              name = "firebase-database" }
androidx-core-ktx                = { group = "androidx.core",                    name = "core-ktx",                        version.ref = "coreKtx" }
androidx-appcompat               = { group = "androidx.appcompat",               name = "appcompat",                       version.ref = "appcompat" }
material                         = { group = "com.google.android.material",      name = "material",                        version.ref = "material" }
androidx-constraintlayout        = { group = "androidx.constraintlayout",        name = "constraintlayout",                version.ref = "constraintlayout" }
androidx-gridlayout              = { group = "androidx.gridlayout",              name = "gridlayout",                      version.ref = "gridlayout" }
androidx-activity-ktx            = { group = "androidx.activity",                name = "activity-ktx",                    version.ref = "activityKtx" }
androidx-lifecycle-viewmodel     = { group = "androidx.lifecycle",               name = "lifecycle-viewmodel-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-livedata      = { group = "androidx.lifecycle",               name = "lifecycle-livedata-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-runtime       = { group = "androidx.lifecycle",               name = "lifecycle-runtime-ktx",           version.ref = "lifecycle" }
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx",            name = "kotlinx-coroutines-android",      version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx",            name = "kotlinx-coroutines-play-services",version.ref = "coroutines" }
play-services-auth               = { group = "com.google.android.gms",           name = "play-services-auth",              version.ref = "playServicesAuth" }
androidx-work-runtime-ktx        = { group = "androidx.work",                    name = "work-runtime-ktx",                version.ref = "work" }
google-api-client-android        = { group = "com.google.api-client",            name = "google-api-client-android",       version.ref = "googleApiClient" }
google-api-services-drive        = { group = "com.google.apis",                  name = "google-api-services-drive",       version.ref = "googleApiDrive" }
google-http-client-gson          = { group = "com.google.http-client",           name = "google-http-client-gson",         version.ref = "googleHttpClient" }
google-oauth-client              = { group = "com.google.oauth-client",          name = "google-oauth-client",             version.ref = "googleOauthClient" }
google-api-client                = { group = "com.google.api-client",            name = "google-api-client",               version.ref = "googleApiClient" }
gson                             = { group = "com.google.code.gson",             name = "gson",                            version.ref = "gson" }
android-pdf-viewer               = { group = "com.github.asadwaheed1",           name = "AndroidPdfViewer",                version.ref = "pdfViewer" }
pdfbox-android                   = { group = "com.tom-roush",                    name = "pdfbox-android",                  version.ref = "pdfbox" }
androidx-room-runtime            = { group = "androidx.room",                    name = "room-runtime",                    version.ref = "room" }
androidx-room-ktx                = { group = "androidx.room",                    name = "room-ktx",                        version.ref = "room" }
androidx-room-compiler           = { group = "androidx.room",                    name = "room-compiler",                   version.ref = "room" }
glide                            = { group = "com.github.bumptech.glide",        name = "glide",                           version.ref = "glide" }
androidx-preference              = { group = "androidx.preference",              name = "preference-ktx",                  version.ref = "preference" }
androidx-recyclerview            = { group = "androidx.recyclerview",            name = "recyclerview",                    version.ref = "recyclerview" }
androidx-swiperefreshlayout      = { group = "androidx.swiperefreshlayout",      name = "swiperefreshlayout",              version.ref = "swiperefresh" }
androidx-profileinstaller        = { group = "androidx.profileinstaller",        name = "profileinstaller",                version.ref = "profileinstaller" }
junit                            = { group = "junit",                            name = "junit",                           version.ref = "junit" }

[plugins]
android-application        = { id = "com.android.application",       version.ref = "agp" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
