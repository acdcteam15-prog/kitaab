name: Release

# Run it by hand (the wizard does this) or push a tag such as v1.2.0.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (add [required] to force every phone to update)'
        required: false
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      # Safety net: if the Gradle wrapper files did not get uploaded, create them here.
      - name: Create the Gradle wrapper if it is missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::gradlew or the wrapper jar is missing from the repository; generating it."
            gradle wrapper --gradle-version 9.8.2
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The signing secrets are missing. Run START-HERE.bat and choose the signing key step."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: bash .github/gradle.sh testDebugUnitTest

      - name: Signed release APK
        run: bash .github/gradle.sh assembleRelease

      - name: Name the APK, write the checksum, verify the signature
        id: pack
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E '^VERSION_NAME=' version.properties | head -1 | cut -d= -f2- | tr -d '[:space:]')
          OFFSET=$(grep -E '^VERSION_CODE_OFFSET=' version.properties | head -1 | cut -d= -f2- | tr -d '[:space:]')
          CODE=$((OFFSET + GITHUB_RUN_NUMBER))
          NAME="Kitaab-${VERSION_NAME//./_}-build${CODE}.apk"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")

          # apksigner comes with the Android build-tools that AGP downloaded.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/$NAME" | tee dist/signature.txt
          grep -q "Verifies" dist/signature.txt

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          NAME: ${{ steps.pack.outputs.name }}
          CODE: ${{ steps.pack.outputs.code }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-build${CODE}"
          {
            if [ -n "$NOTES_INPUT" ]; then printf '%s\n' "$NOTES_INPUT"; else echo "Kitaab ${VERSION}"; fi
          } > dist/notes.md
          # Everything under "[required]" in the notes forces an update on phones that have an older build.
          gh release create "$TAG" "dist/$NAME" "dist/$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kitaab ${VERSION} (build ${CODE})" \
            --notes-file dist/notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - uses: actions/upload-artifact@v7
        with:
          name: Kitaab-release-apk
          path: dist/*
          retention-days: 30
