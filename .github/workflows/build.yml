name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Only platform-tools. Never name platform packages here: their names change, and AGP downloads the
      # platform and build-tools it needs by itself (the licences are accepted by this action).
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      # Safety net: if the Gradle wrapper files did not get uploaded, create them here.
      - name: Create the Gradle wrapper if it is missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::gradlew or the wrapper jar is missing from the repository; generating it."
            gradle wrapper --gradle-version 9.8.2
          fi

      # Windows cannot set the executable bit when the project is committed from a PC.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # google-services.json holds the Firebase / Google API key and is NOT in the repository. Use the real one
      # when the secret exists; otherwise a harmless placeholder so tests and the debug build still compile
      # (for example for Dependabot pull requests, which cannot read secrets).
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret: using a placeholder (this APK cannot sign in or sync)."
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder","firebase_url":"https://placeholder-default-rtdb.firebaseio.com","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.pdfreader.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          fi

      - name: Unit tests
        run: bash .github/gradle.sh testDebugUnitTest

      - name: Debug APK
        run: bash .github/gradle.sh assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: Kitaab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
